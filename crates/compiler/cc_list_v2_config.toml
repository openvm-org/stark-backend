# GraphCompiler config using the list_v2 (persistent-beam) scheduler.
#
# Mirrors cc_default_config.toml but swaps the `[scheduler]` block from
# list_v1 to list_v2. All other sections (device, module_compiler,
# kernel_cache, fusion) are identical.

# ---------- Device ----------
[device]
kind = "cuda"
ordinal = 0

# ---------- ModuleCompiler passthrough ----------
[module_compiler]
arch = "native"
nvcc = "nvcc"
extra_nvcc_flags = []
verbosity = "basic"
check_accesses = false

# ---------- Scheduler ----------
#
# list_v2: persistent-beam, parallel fan-out. Knobs mirror the
# ListSchedulerV2 defaults in the config module.
[scheduler]
mode = "list_v2"
num_streams = 8
max_memory_bound = 9223372036854775807
num_beams = 4
beam_depth = 1
frontier_cap = 1
w_m = 1.0
w_t = 1.0
w_c = -2.0

# ---------- Kernel cache ----------
[kernel_cache]
kind = "enabled"
max_kernels = 300
max_bytes = 10737418240   # 10 GiB

# ---------- Fusion ----------
[fusion]
kind = "on"
max_total_alternatives = 5000
max_enumeration_time_per_round_ms = 2000
max_outer_iterations = 1
validate_alt_graph_acyclicity = true
solver_time_limit_secs = 60.0
solver_num_workers = 0
enable_producer_consumer = true
enable_fanout = true
enable_small_kernel = true
small_kernel_shared_bytes = 49152
small_kernel_max_chain = 6
enable_horizontal = false
enable_epilogue = true
enable_keep_variants = true
enable_all_keep_variants = false
cycle_quantum = 1
blackbox_hint_cycles = 0.0
max_rounds = 4
max_alternatives_per_pass_per_round = 0
optimize_artifact_count = false
verbose = false
