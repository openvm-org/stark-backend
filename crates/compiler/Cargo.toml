[package]
name = "crypto-compiler"
description = "Compiler lowering a functional DSL for cryptography kernels to CUDA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
crypto-compiler-macros = { workspace = true }
openvm-cuda-common = { workspace = true }
isl-rs = { workspace = true }
itertools = { workspace = true }
libloading = { workspace = true }
p3-baby-bear = { workspace = true }
p3-field = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true, default-features = false, features = ["std"] }
sha3 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The `planner-ortools` feature adds the CP-SAT memory-planner backend.
# `cp_sat` links against Google OR-Tools; install it per
# https://developers.google.com/optimization/install (prebuilt binaries) and
# either drop it in one of `/usr/local`, `/usr`, `/opt/homebrew`,
# `/home/linuxbrew/.linuxbrew`, `/opt/ortools`, or set `ORTOOLS_PREFIX` to
# the install prefix before building with `--features planner-ortools`.
# `planner` alone (heuristic backend) has no external link deps.
cp_sat = { version = "0.4", optional = true }

[features]
# `planner` is default so `MemoryPlan` and `GraphCompiler` are always
# available (Refactor 2 decision 3). `planner-ortools` remains optional
# — the CP-SAT backend requires the OR-Tools shared libs.
default = ["planner"]
planner = []
planner-ortools = ["planner", "dep:cp_sat"]

[dev-dependencies]
nvtx = { workspace = true }
openvm-cuda-backend = { workspace = true }
p3-dft = { workspace = true }
p3-symmetric = { workspace = true }

[[bench]]
name = "ntt"
harness = false

[[bench]]
name = "ntt_supra_sweep"
harness = false

[[bench]]
name = "poseidon2"
harness = false

[[example]]
name = "ntt_scale_graph"
required-features = ["planner"]

[[example]]
name = "planner_bench"
required-features = ["planner-ortools"]
